{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tarkari Deal Admin</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #d8e3f2 0%, #b8cff4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: white;
      padding: 0 30px;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 100px;
      /* height: 60px; */
    }

   

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .dashboard-card {
      background: white;
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .welcome-icon {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #d4d8ed 0%, #dcdddf 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
    }

   

    h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .description {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 35px;
      background: linear-gradient(135deg, #243c6a 0%, #3a5a8c 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(36, 60, 106, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 40px;
    }

    .stat-card {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border-top: 4px solid #243c6a;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #243c6a;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
      background: white;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 0 20px;
      }
      
      .brand {
        font-size: 18px;
      }
      
      .dashboard-card {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 26px;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- <nav class="navbar">
    <h1>Tarkari Deal Backend </h1>
  </nav> -->

  <div class="container">
    <div class="dashboard-card">
      <div class="welcome-icon ">
        <img src="../../media/logo.png" class="logo logo-container" alt="Logo">
      </div>
      
      <h1>Welcome to Tarkari Deal</h1>
      
      <p class="description">
        Your complete vegetable market management solution. 
        Manage vendors, track orders, update prices, and analyze market trends 
        from a single dashboard.
      </p>
      
      <a href="/admin/" class="btn-primary">
        <i class="fas fa-sign-in-alt"></i>
        Go to Admin Panel
      </a>
      
      <div class="stats
